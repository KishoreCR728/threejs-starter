<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shader Patterns — three-starter</title>
</head>

<body>
  <a href="/" class="nav-link">← Home</a>

  <div class="hint-panel">
    <h2>Fragment Shader Patterns</h2>
    <p>
      A single fullscreen quad. Every pixel is computed by the fragment shader from UV coords,
      time, and your cursor. Move your mouse to ripple the field.
    </p>

    <label>Mode
      <select id="mode">
        <option value="0">FBM gradient</option>
        <option value="1">Voronoi cells</option>
        <option value="2">Animated stripes</option>
        <option value="3">Polar rays</option>
      </select>
    </label>

    <label>Scale <span class="val" id="v-scale">3.0</span>
      <input type="range" id="scale" min="0.5" max="12" step="0.1" value="3">
    </label>

    <label>Speed <span class="val" id="v-speed">0.4</span>
      <input type="range" id="speed" min="0" max="2" step="0.05" value="0.4">
    </label>

    <label>Cursor warp <span class="val" id="v-warp">0.05</span>
      <input type="range" id="warp" min="0" max="0.3" step="0.005" value="0.05">
    </label>
  </div>

  <script type="module" src="/src/shaders2.js"></script>
</body>

</html>
