<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaders — three-starter</title>
</head>

<body>
  <a href="/" class="nav-link">← Home</a>

  <div class="hint-panel">
    <h2>GLSL Shaders</h2>
    <p>
      Vertex shader displaces every sphere vertex using animated 3D simplex noise.
      Fragment shader colors the surface by displacement amount and adds a fresnel rim glow.
      Drag to orbit, scroll to zoom.
    </p>
    <label>Intensity <span class="val" id="v-intensity">0.30</span>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.3">
    </label>
    <label>Frequency <span class="val" id="v-frequency">1.5</span>
      <input type="range" id="frequency" min="0.3" max="4" step="0.05" value="1.5">
    </label>
    <label>Speed <span class="val" id="v-speed">0.6</span>
      <input type="range" id="speed" min="0" max="2.5" step="0.05" value="0.6">
    </label>
  </div>

  <script type="module" src="/src/shaders.js"></script>
</body>

</html>
